allow_remote_control yes
listen_on unix:/tmp/mykitty




# --- Appearance ---
# Background opacity (0.0 to 1.0)
background_opacity 0.85

# If using Hyprland, this enables the "blur" behind the window
# (Make sure to also have blur enabled in your hyprland.conf)
dynamic_background_opacity yes

# --- Font Settings ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0




# --- Cursor ---
cursor_shape     beam
cursor_blink_interval 0.5

# --- Window Layout ---
window_padding_width 15
confirm_os_window_close 0

include /home/levi/nixos-dotfiles/config/kitty/colors.conf

