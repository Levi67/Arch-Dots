"$schema" = 'https://starship.rs/config-schema.json'

# Minimal two-part prompt: context on the left, ❯ on its own line.
# Colors come from [palettes.term]; ~/.config/scripts/term-theme regenerates
# that block from wallust or winter mode into ~/.cache/term-theme/starship.toml.
add_newline = true
palette = "term"

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold accent"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "branch"
format = "[$symbol$branch]($style) "

[git_state]
style = "yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "status"
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = " "
style = "muted"
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "muted"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "muted"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "muted"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "muted"
format = "[󰔟 $duration]($style) "

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# --- palette: everything below is replaced by term-theme (defaults = slate blue) ---
[palettes.term]
accent = "#7c839e"
branch = "#a6adc8"
status = "#e5c07b"
muted = "#6c7086"
